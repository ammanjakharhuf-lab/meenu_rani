<text x='742' y='252' font-size='9.9' text-anchor='middle' font-weight='normal' fill='#111' ><tspan x='742' dy='0.0'>inclusive, distributed and</tspan><tspan x='742' dy='12.4'>compassionate leadership ·</tspan><tspan x='742' dy='12.4'>transparent workload models</tspan></text>
