<rect x='30' y='300' width='250' height='150' rx='9' fill='#e9f3e5' stroke='#333' stroke-width='1.2'/><text x='155.0' y='319' font-size='12' text-anchor='middle' font-weight='bold' fill='#111' ><tspan x='155.0' dy='0.0'>Job and personal resources</tspan></text><text x='155.0' y='337.0' font-size='10.2' text-anchor='middle' font-weight='normal' fill='#222' ><tspan x='155.0' dy='0.0'>autonomy and academic freedom · collegial</tspan><tspan x='155.0' dy='12.8'>and mentoring support · protected</tspan><tspan x='155.0' dy='12.8'>development time · fair appraisal ·</tspan><tspan x='155.0' dy='12.8'>self-efficacy and reflective capacity</tspan></text>
<rect x='340' y='50' width='230' height='100' rx='9' fill='#f2c7c1' stroke='#333' stroke-width='1.2'/><text x='455.0' y='69' font-size='12' text-anchor='middle' font-weight='bold' fill='#111' ><tspan x='455.0' dy='0.0'>Health-impairment process</tspan></text><text x='455.0' y='87.0' font-size='10.2' text-anchor='middle' font-weight='normal' fill='#222' ><tspan x='455.0' dy='0.0'>chronic strain → exhaustion,</tspan><tspan x='455.0' dy='12.8'>disengagement, attrition</tspan></text>
<rect x='340' y='350' width='230' height='100' rx='9' fill='#cbe6c4' stroke='#333' stroke-width='1.2'/><text x='455.0' y='369' font-size='12' text-anchor='middle' font-weight='bold' fill='#111' ><tspan x='455.0' dy='0.0'>Motivational process</tspan></text><text x='455.0' y='387.0' font-size='10.2' text-anchor='middle' font-weight='normal' fill='#222' ><tspan x='455.0' dy='0.0'>engagement → professional growth,</tspan><tspan x='455.0' dy='12.8'>innovation, identity consolidation</tspan></text>
