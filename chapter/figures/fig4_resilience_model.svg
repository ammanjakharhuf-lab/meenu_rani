<text x='742' y='134' font-size='9.9' text-anchor='middle' font-weight='normal' fill='#111' ><tspan x='742' dy='0.0'>reflective practice · boundary</tspan><tspan x='742' dy='12.4'>setting · peer support ·</tspan><tspan x='742' dy='12.4'>purposeful career planning</tspan></text>
<rect x='622' y='208' width='241' height='104' rx='8' fill='white' stroke='#6a4c93' stroke-width='1.6'/>
