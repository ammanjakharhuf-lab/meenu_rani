<text x='742' y='370' font-size='9.9' text-anchor='middle' font-weight='normal' fill='#111' ><tspan x='742' dy='0.0'>well-being policy · sustainable</tspan><tspan x='742' dy='12.4'>metrics · recognition of teaching</tspan><tspan x='742' dy='12.4'>and service · secure contracts</tspan></text>
